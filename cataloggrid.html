<!DOCTYPE html>
<html>
<head>
<title>Shopping Catalog using Grid</title>
<style>
body{
margin:0;
padding:20px;
display:grid;
place-items:center;
height:100vh;
}
#catalog{
display:grid;
grid-template-columns:repeat(3,2fr);
gap:20 px;
}
.item{
display:grid;
place-items:center;
gap:8px;
padding:15px;
border:1px solid #ddd;
border-radius:8px;
}
.item img{
width:100px;
height:100px;
border-radius:8px;
}
button{
background-color:#007BFF;
color:#fff;
padding:8px;
border-radius:4px;
border:none;
cursor:pointer;
}
</style>
</head>
<body>
<h2>Catalog</h2>
<div id="catalog">
<div class="item">
<img src="" alt="Item 1">
<span>Item 1</span>
<span>Price:100$</span>
<button>Add to cart</button>
<br>
</div>
<div class="item">
<img src="" alt="Item 2">
<span>Item 2</span>
<span>Price:150$</span>
<button>Add to cart</button>
<br>
</div>
<div class="item">
<img src="" alt="Item 3">
<span>Item 3</span>
<span>Price:180$</span>
<button>Add to cart</button>
</div>
<br>
<div class="item">
<img src="" alt="Item 3">
<span>Item 3</span>
<span>Price:180$</span>
<button>Add to cart</button>
</div>
<br>
<div class="item">
<img src="" alt="Item 3">
<span>Item 3</span>
<span>Price:180$</span>
<button>Add to cart</button>
</div>
<br>
</div>
</body>
</html>
